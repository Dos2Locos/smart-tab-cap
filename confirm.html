<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tab limit reached</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202124;
      background: #fff;
      padding: 24px;
      /* Fixed height, not min-height: with min-height the flex column grows to
         fit the tab list, so `flex: 1` never constrains it and the action bar
         gets pushed below the fold (UI-01). */
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #5f6368;
      margin-bottom: 16px;
    }

    #tab-list {
      flex: 1;
      /* Flex items default to min-height: auto, which refuses to shrink below
         content height -- without this the list still overflows. */
      min-height: 0;
      overflow-y: auto;
      border: 1px solid #dadce0;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .tab-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-bottom: 1px solid #f1f3f4;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }

    .tab-item:last-child {
      border-bottom: none;
    }

    .tab-item:hover {
      background: #f8f9fa;
    }

    .tab-checkbox {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      accent-color: #1a73e8;
      cursor: pointer;
    }

    .tab-favicon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .tab-info {
      flex: 1;
      overflow: hidden;
    }

    .tab-title {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-url {
      font-size: 11px;
      color: #5f6368;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-badge {
      font-size: 10px;
      padding: 2px 6px;
      background: #e8f0fe;
      color: #1a73e8;
      border-radius: 10px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .selection-hint {
      font-size: 12px;
      color: #d93025;
      margin-bottom: 8px;
      min-height: 18px;
    }

    #new-tab-msg {
      font-size: 13px;
      color: #5f6368;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    /* Secondary escape hatch: raising the limit is deliberately quieter than
       closing tabs, which is what this window exists to make you do. */
    .raise {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding-top: 12px;
      margin-bottom: 12px;
      border-top: 1px solid #f1f3f4;
      font-size: 12px;
      color: #5f6368;
    }

    .raise input {
      width: 64px;
      padding: 4px 6px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
    }

    .raise button {
      padding: 4px 10px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      background: #fff;
      color: #1a73e8;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .raise button:hover {
      background: #f8f9fa;
    }

    .actions {
      flex-shrink: 0;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    button {
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 0;
    }

    #btn-cancel {
      background: #f1f3f4;
      color: #202124;
    }

    #btn-cancel:hover {
      background: #e8eaed;
    }

    #btn-confirm {
      background: #d93025;
      color: #fff;
    }

    #btn-confirm:hover {
      background: #b31412;
    }
  </style>
</head>
<body>
  <div class="icon">⚠️</div>
  <h1>Tab limit reached</h1>
  <p class="subtitle" id="subtitle"></p>

  <div class="selection-hint" id="selection-hint"></div>
  <div id="tab-list"></div>
  <div id="new-tab-msg" style="display:none"></div>

  <div class="raise">
    <label for="new-limit">Or raise the limit to</label>
    <input type="number" id="new-limit" step="1" min="1">
    <button type="button" id="btn-raise-session">for this session</button>
    <button type="button" id="btn-raise-always">for good</button>
  </div>

  <div class="actions">
    <button id="btn-cancel">Close new tab</button>
    <button id="btn-confirm">Close listed tabs</button>
  </div>

  <script src="confirm.js"></script>
</body>
</html>
